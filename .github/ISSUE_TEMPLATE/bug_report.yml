name: Report a game bug
description: A reproducible vanilla bug you would like fixed
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A fix has to point at a confirmed cause in the game's own Lua, so the
        more reproducible you make this, the more likely it gets fixed. A save
        that already shows the bug is the single most useful thing you can give.

  - type: textarea
    id: what
    attributes:
      label: What goes wrong
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Game version
      placeholder: "1.0.7"
    validations:
      required: true

  - type: input
    id: save
    attributes:
      label: Savegame link
      description: >
        Saves live in %APPDATA%\Surviving Mars Relaunched\saves and are usually
        over GitHub's 25 MB attachment limit — a .sav is already compressed, so
        zipping it barely helps. Upload it anywhere (Drive, Dropbox, MEGA) and
        paste the link. Under 25 MB, zip it and drag it into the box below
        instead; GitHub refuses a bare .sav but accepts a zip.
    validations:
      required: false

  - type: input
    id: mods
    attributes:
      label: Other mods enabled
      description: A vanilla bug that only appears with other mods loaded is a different problem.
      placeholder: none
    validations:
      required: true

  - type: textarea
    id: extras
    attributes:
      label: Log, screenshots, anything else
      description: >
        The newest log from %APPDATA%\Surviving Mars Relaunched\logs helps, and
        so does a screenshot if the bug is visible. Drag files in here.
    validations:
      required: false
