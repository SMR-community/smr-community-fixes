name: Publish to Paradox Mods

# Packs the mod payload and publishes it over the Paradox Mods HTTP API, with no
# game install involved. Runs on a version tag, or on demand.
#
# Authentication is the PDX_REFRESH repository secret: a Paradox refresh token,
# exchanged for a session token at the start of every run. No password is
# stored, and PDX_REFRESH should belong to a dedicated publishing account.
#
# The mod page's own text - display name, short and long description - is read
# back from Paradox and republished unchanged, because the service requires all
# three on every version and would otherwise blank them. Edit the page on
# Paradox, not here.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      env:
        # The other hosts the SDK names have never answered for this game, so
        # prod is the only one a rehearsal can use. Dry run is the safety net
        # instead: it sends nothing at all.
        description: Which Paradox environment to publish to
        type: choice
        options: [prod, sandbox]
        default: prod
      dry_run:
        description: Verify packing, secrets and the payload without sending anything
        type: boolean
        default: true

permissions:
  contents: write  # a successful publish cuts a release
  issues: write    # a failed one opens an issue

concurrency:
  group: publish
  cancel-in-progress: false

env:
  # https://mods.paradoxplaza.com/mods/154004/Any - the existing mod page.
  # Without this the client would publish a NEW mod instead of a new version of
  # this one, leaving players on a page that never updates again.
  PDX_MOD_ID: "154004"

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tags and history, so the previous published version can be read
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      # Publishing is the one step players see and cannot be undone quietly.
      # Refuse a tag whose payload would not even pass the ordinary fix check.
      - name: Check the payload
        run: lua5.4 tools/sync_mod.lua check

      # A tag that ships the same 'version' as the last one would overwrite that
      # release rather than add one, so require the integer to have moved.
      - name: Check the version moved
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          read_version() { sed -n "s/.*'version', \([0-9]\{1,\}\),.*/\1/p" | head -n 1; }
          version=$(read_version < metadata.lua)
          previous_tag=$(git tag --list 'v*' --sort=-v:refname \
            | grep -v "^${GITHUB_REF_NAME}$" | head -n 1)
          if [ -z "$previous_tag" ]; then
            echo "no earlier tag; this is the first publication at version $version"
            exit 0
          fi
          previous=$(git show "$previous_tag:metadata.lua" | read_version)
          echo "$previous_tag published version $previous; this tag has $version"
          if [ "$version" -le "$previous" ]; then
            echo "::error::version $version is not greater than $previous published at $previous_tag."
            echo "::error::Land a fix (which bumps it automatically) or edit metadata.lua before tagging."
            exit 1
          fi

      # The payload is exactly what the game loads: no docs, no templates, no
      # tools, no workflows. Same rule as section 1 of DESCRIPTION.md.
      - name: Pack the payload
        run: |
          mkdir -p dist
          zip -r dist/SMRCF.zip metadata.lua items.lua Code Images -x '*.gitkeep'
          version=$(sed -n "s/.*'version', \([0-9]\{1,\}\),.*/\1/p" metadata.lua | head -n 1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ls -l dist/SMRCF.zip

      - name: Publish
        env:
          # Refresh-token auth: no password, no salt.
          # See tools/publish/PDX_API_NOTES.md.
          PDX_REFRESH: ${{ secrets.PDX_REFRESH }}
        run: |
          # Deliberately no --title, --short-description or --description-file:
          # omitting them republishes what the mod page already shows. Passing
          # them would overwrite the page from this repository every release.
          changelog=$(sed -n "s/.*'last_changes', \"\(.*\)\",/\1/p" metadata.lua | head -n 1)
          echo "changelog entry: $changelog"
          python tools/publish/pdx_client.py \
            --payload dist/SMRCF.zip \
            --thumbnail Images/smr_community_fixes.jpg \
            --changelog "$changelog" \
            --version "$VERSION" \
            --mod-id "$PDX_MOD_ID" \
            --env "${{ inputs.env || 'prod' }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smrcf-payload
          path: |
            dist/SMRCF.zip
            publish-result.json

      # A failed run emails whoever tagged and shows a red mark, but only they
      # see it, and the log is gone in 90 days. An issue is visible to the whole
      # org and outlives the run. One issue per tag, not one per attempt: a
      # retagged failure comments on the existing one.
      - name: Report a failed publish
        if: failure() && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          field() { python -c "import json,sys;print(json.load(open('publish-result.json')).get(sys.argv[1]) or '-')" "$1" 2>/dev/null || echo '-'; }
          step=$(field failed_step)
          status=$(field status)
          message=$(field message)
          [ "$step" = "-" ] && step="before the upload started"
          [ "$message" = "-" ] && message="see the run log"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # The label has to exist before it can be applied.
          gh label create publish-failure --color B60205 \
            --description "A tag failed to publish to Paradox Mods" 2>/dev/null || true

          body=$(printf '%s\n' \
            "Publishing \`$GITHUB_REF_NAME\` to Paradox Mods failed." "" \
            "| | |" "|---|---|" \
            "| Failed at | \`$step\` |" \
            "| HTTP status | $status |" \
            "| Message | $message |" \
            "| Run | $run_url |" \
            "| Tagged by | @$GITHUB_ACTOR |" "" \
            "Nothing is live. Fix the cause, then tag again with a higher \`'version'\` in metadata.lua." \
            "The per-step table is in the run summary.")

          existing=$(gh issue list --state open --label publish-failure \
            --search "in:title $GITHUB_REF_NAME" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "commented on existing issue #$existing"
          else
            gh issue create --title "Publishing $GITHUB_REF_NAME failed" \
              --label publish-failure --body "$body"
          fi

      # Success needs to be as visible as failure, or the only signal anyone
      # ever sees is the bad one. A release records what shipped, carries the
      # exact payload, and shows on the repository front page.
      - name: Announce a successful publish
        if: success() && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/.*'version', \([0-9]\{1,\}\),.*/\1/p" metadata.lua | head -n 1)
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          notes=$(printf '%s\n' \
            "Published to Paradox Mods as **version $version**." "" \
            "https://mods.paradoxplaza.com/authors/SMR-community" "" \
            "\`SMRCF.zip\` below is the exact payload that was uploaded." \
            "Tagged by @$GITHUB_ACTOR · [run]($run_url)")
          gh release create "$GITHUB_REF_NAME" dist/SMRCF.zip \
            --title "$GITHUB_REF_NAME — mod version $version" \
            --notes "$notes" --generate-notes
          echo "### Published version $version" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            >> "$GITHUB_STEP_SUMMARY"

      # Otherwise a fixed publish leaves its failure issue open forever, and
      # nobody trusts the label after that.
      - name: Close the failure issue once it publishes
        if: success() && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --state open --label publish-failure \
            --search "in:title $GITHUB_REF_NAME" --json number --jq '.[].number')
          for number in $open; do
            gh issue close "$number" \
              --comment "Published successfully on a later run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
