name: Publish to Paradox Mods

# Packs the mod payload and publishes it over the Paradox Mods HTTP API, with no
# game install involved. Runs on a version tag, or on demand.
#
# INCOMPLETE until the routes in tools/publish/pdx_client.py are filled from one
# capture run - see tools/publish/PDX_API_NOTES.md. Until then the publish step
# exits 3 with the list of routes it still needs, and nothing is sent.
#
# Credentials come from repository secrets PDX_USER and PDX_PASS. Note that any
# organisation member who can push a workflow can read those secrets, so use a
# dedicated publishing account rather than a personal one.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      env:
        description: Which Paradox environment to publish to
        type: choice
        options: [sandbox, prod]
        default: sandbox
      dry_run:
        description: Verify packing, secrets and signing without sending anything
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tags and history, so the previous published version can be read
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      # Publishing is the one step players see and cannot be undone quietly.
      # Refuse a tag whose payload would not even pass the ordinary fix check.
      - name: Check the payload
        run: lua5.4 tools/sync_mod.lua check

      # A tag that ships the same 'version' as the last one would overwrite that
      # release rather than add one, so require the integer to have moved.
      - name: Check the version moved
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          read_version() { sed -n "s/.*'version', \([0-9]\{1,\}\),.*/\1/p" | head -n 1; }
          version=$(read_version < metadata.lua)
          previous_tag=$(git tag --list 'v*' --sort=-v:refname \
            | grep -v "^${GITHUB_REF_NAME}$" | head -n 1)
          if [ -z "$previous_tag" ]; then
            echo "no earlier tag; this is the first publication at version $version"
            exit 0
          fi
          previous=$(git show "$previous_tag:metadata.lua" | read_version)
          echo "$previous_tag published version $previous; this tag has $version"
          if [ "$version" -le "$previous" ]; then
            echo "::error::version $version is not greater than $previous published at $previous_tag."
            echo "::error::Land a fix (which bumps it automatically) or edit metadata.lua before tagging."
            exit 1
          fi

      # The payload is exactly what the game loads: no docs, no templates, no
      # tools, no workflows. Same rule as section 1 of DESCRIPTION.md.
      - name: Pack the payload
        run: |
          mkdir -p dist
          zip -r dist/SMRCF.zip metadata.lua items.lua Code Images -x '*.gitkeep'
          version=$(sed -n "s/.*'version', \([0-9]\{1,\}\),.*/\1/p" metadata.lua | head -n 1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ls -l dist/SMRCF.zip

      - name: Publish
        env:
          PDX_USER: ${{ secrets.PDX_USER }}
          PDX_PASS: ${{ secrets.PDX_PASS }}
        run: |
          python tools/publish/pdx_client.py \
            --payload dist/SMRCF.zip \
            --thumbnail Images/smr_community_fixes.jpg \
            --screenshot Images/screenshot_01.jpg \
            --title "SMR Community Fixes" \
            --short-description "A community-maintained collection of bug fixes for Surviving Mars: Relaunched." \
            --version "$VERSION" \
            --env "${{ inputs.env || 'prod' }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smrcf-payload
          path: dist/SMRCF.zip
